# Standalone alternative for DSM's built-in HTTPS reverse proxy.
# Do not combine with docker-compose.yml: Compose may merge published ports.
version: "3.8"
services:
  jinhua:
    image: jinhua-friends:1.2.2
    container_name: jinhua-friends
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GAME_PORT:-18780}:8080"
    environment:
      PORT: "8080"
      BIND_ADDRESS: "0.0.0.0"
      DATA_DIR: /data
      ROOM_PASSWORD: "${ROOM_PASSWORD:?Set ROOM_PASSWORD in .env first}"
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?Set the public HTTPS game URL in .env first}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
