version: "3.8"
services:
  jinhua:
    image: jinhua-friends:1.0.0
    container_name: jinhua-friends
    restart: unless-stopped
    ports:
      - "18780:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ROOM_PASSWORD: "${ROOM_PASSWORD:?Set ROOM_PASSWORD in .env first}"
      COOKIE_SECURE: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
